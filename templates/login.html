<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Employee Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --navy:       #1e3a5f;
            --navy-dark:  #162d4a;
            --navy-mid:   #2d4a7a;
            --bg-outer:   #dce4ef;
            --white:      #ffffff;
            --border:     #d0d8e4;
            --text:       #1e3a5f;
            --muted:      #7a8fa6;
            --red:        #e74c3c;
            --font:       'Plus Jakarta Sans', sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg-outer);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .outer-box {
            background: var(--navy);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(30,58,95,.35);
        }

        .login-card {
            background: var(--white);
            border-radius: 10px;
            padding: 40px 36px 36px;
            width: 100%;
            max-width: 360px;
            border: 2px solid #4a7ab5;
        }

        .card-header { text-align: center; margin-bottom: 28px; }
        .card-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: .5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .card-header p { font-size: .8rem; color: var(--muted); }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 18px;
            font-size: .8rem;
            color: var(--red);
        }
        .error-box ul { list-style: none; }
        .error-box li::before { content: '⚠ '; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: .82rem; font-weight: 500; color: var(--text); margin-bottom: 6px; }

        .input-wrap { position: relative; }
        .form-control {
            width: 100%;
            background: var(--white);
            border: none;
            border-bottom: 1.5px solid var(--border);
            color: var(--text);
            padding: 9px 32px 9px 0;
            font-size: .88rem;
            font-family: var(--font);
            outline: none;
            transition: border-color .2s;
        }
        .form-control:focus { border-bottom-color: var(--navy); }
        .form-control::placeholder { color: #b8c8d8; }

        .toggle-pw {
            position: absolute; right: 0; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            cursor: pointer; color: var(--muted);
            font-size: .78rem; padding: 4px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--navy-dark);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: .9rem;
            font-weight: 700;
            font-family: var(--font);
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            transition: background .2s, transform .15s;
        }
        .btn-login:hover { background: var(--navy-mid); transform: translateY(-1px); }

        .divider {
            display: flex; align-items: center;
            gap: 12px; margin: 20px 0;
            color: var(--muted); font-size: .75rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }

        .btn-google {
            width: 100%;
            padding: 10px;
            background: var(--white);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: .85rem;
            font-weight: 500;
            font-family: var(--font);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            transition: background .2s;
        }
        .btn-google:hover { background: #f0f4f8; }

        .signup-text {
            text-align: center; margin-top: 18px;
            font-size: .78rem; color: var(--muted);
        }
        .signup-text a { color: var(--navy-mid); font-weight: 600; text-decoration: none; }
        .signup-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="outer-box">
    <div class="login-card">
        <div class="card-header">
            <h1>Welcome, Employee!</h1>
            <p>Please login to employee dashboard</p>
        </div>

        {% if form.non_field_errors %}
        <div class="error-box">
            <ul>{% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}</ul>
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="form-group">
                <label class="form-label">Username</label>
                <div class="input-wrap">
                    <input type="text" name="username" class="form-control"
                           placeholder="Enter your username"
                           value="{{ form.username.value|default:'' }}" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrap">
                    <input type="password" name="password" id="pw-input"
                           class="form-control" placeholder="••••••••" required>
                    <button type="button" class="toggle-pw" id="toggle-pw">👁</button>
                </div>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="divider">or</div>

        <a href="#" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign in with Google
        </a>
<div class="signup-text">
    Don't have an account? 
    <a href="{% url 'employee:register' %}">Sign Up</a>
</div>
    </div>
</div>

<script>
    const pwInput = document.getElementById('pw-input');
    const togglePw = document.getElementById('toggle-pw');
    togglePw.addEventListener('click', () => {
        pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
        togglePw.textContent = pwInput.type === 'password' ? '👁' : '🙈';
    });
</script>
</body>
</html>
